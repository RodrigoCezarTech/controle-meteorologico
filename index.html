```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coleta de Dados Meteorológicos</title>

<style>
:root {
    --background: #0b1220;
    --card: #172338;
    --input: #0f1b2e;
    --border: #293950;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --text: #f8fafc;
    --muted: #94a3b8;
    --success: #10b981;
    --danger: #ef4444;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top right, #172d50, transparent 40%),
        var(--background);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    color: var(--text);
}

.container {
    width: 100%;
    max-width: 490px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    box-shadow: 0 25px 60px rgba(0,0,0,.35);
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.logo {
    width: 65px;
    height: 65px;
    background: rgba(59,130,246,.15);
    border: 1px solid rgba(59,130,246,.3);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    margin: 0 auto 18px;
}

.header h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 9px;
}

.header p {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
}

.divider {
    height: 1px;
    background: var(--border);
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 21px;
}

label {
    display: block;
    margin-bottom: 9px;
    font-size: 13px;
    font-weight: 600;
    color: #cbd5e1;
}

.required {
    color: #f87171;
}

input {
    width: 100%;
    padding: 15px;
    background: var(--input);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: white;
    font-size: 15px;
    outline: none;
    transition: .2s;
}

input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(59,130,246,.12);
}

input::placeholder {
    color: #64748b;
}

.coords-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.coords-grid input {
    font-family: Consolas, monospace;
}

.helper {
    font-size: 11px;
    color: var(--muted);
    margin-top: 7px;
}

.btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: .2s;
    margin-bottom: 12px;
}

.btn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.btn-gps {
    background: #263b59;
    color: white;
    border: 1px solid #385271;
}

.btn-gps:hover:not(:disabled) {
    background: #344d70;
}

.btn-submit {
    background: var(--primary);
    color: white;
}

.btn-submit:hover:not(:disabled) {
    background: var(--primary-hover);
    transform: translateY(-1px);
}

.status {
    display: none;
    padding: 14px;
    margin-top: 15px;
    border-radius: 10px;
    font-size: 13px;
    text-align: center;
    line-height: 1.5;
}

.status.info {
    display: block;
    background: rgba(59,130,246,.12);
    color: #93c5fd;
    border: 1px solid rgba(59,130,246,.3);
}

.status.success {
    display: block;
    background: rgba(16,185,129,.12);
    color: #6ee7b7;
    border: 1px solid rgba(16,185,129,.3);
}

.status.error {
    display: block;
    background: rgba(239,68,68,.12);
    color: #fca5a5;
    border: 1px solid rgba(239,68,68,.3);
}

.map-container {
    text-align: center;
}

.map-link {
    display: none;
    margin-top: 18px;
    color: #60a5fa;
    text-decoration: none;
    font-size: 13px;
}

.map-link:hover {
    text-decoration: underline;
}

.footer {
    text-align: center;
    margin-top: 25px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: #64748b;
}

@media(max-width:420px) {
    .container {
        padding: 23px;
    }

    .coords-grid {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .header h1 {
        font-size: 21px;
    }
}
</style>
</head>

<body>

<main class="container">

    <header class="header">

        <div class="logo">🌦️</div>

        <h1>Coleta de Dados</h1>

        <p>
            Registro de informações meteorológicas
            e coordenadas geográficas.
        </p>

    </header>

    <div class="divider"></div>

    <form
        id="geoForm"
        action="https://docs.google.com/forms/d/e/1FAIpQLSeTN0-x6H_4JktWa03INvc3uyJduHjPOzmcwydaF6NGGLUauw/formResponse"
        method="POST"
        target="googleFormFrame"
    >

        <div class="form-group">

            <label for="local">
                Nome do local <span class="required">*</span>
            </label>

            <input
                type="text"
                id="local"
                name="entry.346371602"
                placeholder="Ex: Campinas"
                required
                autocomplete="off"
            >

        </div>

        <div class="coords-grid">

            <div class="form-group">

                <label for="latitude">
                    Latitude <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="latitude"
                    name="entry.260018039"
                    placeholder="-22.913604"
                    inputmode="decimal"
                    autocomplete="off"
                    required
                >

                <p class="helper">Entre -90 e 90</p>

            </div>

            <div class="form-group">

                <label for="longitude">
                    Longitude <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="longitude"
                    name="entry.1955144794"
                    placeholder="-47.060800"
                    inputmode="decimal"
                    autocomplete="off"
                    required
                >

                <p class="helper">Entre -180 e 180</p>

            </div>

        </div>

        <button
            type="button"
            class="btn btn-gps"
            id="btnGPS"
        >
            📍 Obter coordenadas pelo GPS
        </button>

        <button
            type="submit"
            class="btn btn-submit"
            id="btnSubmit"
        >
            Enviar registro
        </button>

        <div id="status" class="status"></div>

        <div class="map-container">

            <a
                id="mapLink"
                class="map-link"
                target="_blank"
                rel="noopener noreferrer"
            >
                🗺️ Visualizar localização no Google Maps
            </a>

        </div>

    </form>

    <iframe
        name="googleFormFrame"
        id="googleFormFrame"
        title="Envio do formulário"
        style="display:none"
    ></iframe>

    <footer class="footer">
        Sistema de coleta de dados meteorológicos
    </footer>

</main>

<script>

// ======================================
// CONFIGURAÇÕES
// ======================================

const form = document.getElementById("geoForm");

const localInput = document.getElementById("local");
const latInput = document.getElementById("latitude");
const lngInput = document.getElementById("longitude");

const btnGPS = document.getElementById("btnGPS");
const btnSubmit = document.getElementById("btnSubmit");

const statusBox = document.getElementById("status");
const mapLink = document.getElementById("mapLink");


// ======================================
// MENSAGENS
// ======================================

function showStatus(message, type) {

    statusBox.textContent = message;

    statusBox.className = "status " + type;

}


// ======================================
// NORMALIZAÇÃO DECIMAL
// ======================================

function normalizarCoordenada(valor) {

    valor = valor.trim();

    // Aceita vírgula como separador decimal.
    valor = valor.replace(",", ".");

    // Rejeita múltiplos pontos.
    // Exemplo inválido: -22.913.604
    if ((valor.match(/\./g) || []).length > 1) {
        return null;
    }

    // Aceita apenas sinal negativo e números decimais.
    if (!/^-?\d+(\.\d+)?$/.test(valor)) {
        return null;
    }

    const numero = Number(valor);

    if (!Number.isFinite(numero)) {
        return null;
    }

    return numero.toFixed(6);

}


// ======================================
// VALIDAÇÃO DAS COORDENADAS
// ======================================

function validarCoordenadas() {

    const lat = normalizarCoordenada(latInput.value);
    const lng = normalizarCoordenada(lngInput.value);

    if (lat === null) {

        showStatus(
            "Latitude inválida. Utilize, por exemplo: -22.913604",
            "error"
        );

        latInput.focus();

        return false;
    }

    if (lng === null) {

        showStatus(
            "Longitude inválida. Utilize, por exemplo: -47.060800",
            "error"
        );

        lngInput.focus();

        return false;
    }

    const latitude = Number(lat);
    const longitude = Number(lng);

    if (latitude < -90 || latitude > 90) {

        showStatus(
            "Latitude deve estar entre -90 e 90.",
            "error"
        );

        latInput.focus();

        return false;
    }

    if (longitude < -180 || longitude > 180) {

        showStatus(
            "Longitude deve estar entre -180 e 180.",
            "error"
        );

        lngInput.focus();

        return false;
    }

    // IMPORTANTE:
    // Envia somente números com ponto decimal.
    // Nunca utiliza formatação brasileira de milhares.

    latInput.value = lat;
    lngInput.value = lng;

    return true;

}


// ======================================
// ATUALIZAR GOOGLE MAPS
// ======================================

function atualizarMapa() {

    const lat = normalizarCoordenada(latInput.value);
    const lng = normalizarCoordenada(lngInput.value);

    if (lat === null || lng === null) {

        mapLink.style.display = "none";

        return;
    }

    const latitude = Number(lat);
    const longitude = Number(lng);

    if (
        latitude < -90 ||
        latitude > 90 ||
        longitude < -180 ||
        longitude > 180
    ) {

        mapLink.style.display = "none";

        return;
    }

    mapLink.href =
        `https://www.google.com/maps?q=${lat},${lng}`;

    mapLink.style.display = "inline-block";

}

latInput.addEventListener("input", atualizarMapa);
lngInput.addEventListener("input", atualizarMapa);


// ======================================
// CAPTURA GPS
// ======================================

function capturarGPS() {

    if (!navigator.geolocation) {

        showStatus(
            "Seu navegador não suporta geolocalização.",
            "error"
        );

        return;
    }

    btnGPS.disabled = true;

    btnGPS.textContent = "Obtendo localização...";

    showStatus(
        "Solicitando coordenadas do dispositivo...",
        "info"
    );

    navigator.geolocation.getCurrentPosition(

        function(position) {

            const latitude =
                position.coords.latitude.toFixed(6);

            const longitude =
                position.coords.longitude.toFixed(6);

            // Valores em decimal internacional.
            latInput.value = latitude;
            lngInput.value = longitude;

            atualizarMapa();

            btnGPS.disabled = false;

            btnGPS.textContent =
                "📍 Atualizar coordenadas pelo GPS";

            showStatus(
                "Localização obtida! Precisão aproximada: " +
                Math.round(position.coords.accuracy) +
                " metros.",
                "success"
            );

        },

        function(error) {

            btnGPS.disabled = false;

            btnGPS.textContent =
                "📍 Tentar novamente";

            let mensagem = "Erro ao obter localização.";

            if (error.code === 1) {

                mensagem =
                    "Permissão negada. Autorize a localização no navegador.";

            } else if (error.code === 2) {

                mensagem =
                    "Não foi possível determinar sua localização.";

            } else if (error.code === 3) {

                mensagem =
                    "Tempo esgotado. Tente novamente.";

            }

            showStatus(mensagem, "error");

        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }

    );

}

btnGPS.addEventListener("click", capturarGPS);


// ======================================
// ENVIO GOOGLE FORMS
// ======================================

let aguardandoResposta = false;

form.addEventListener("submit", function(event) {

    event.preventDefault();

    if (!localInput.value.trim()) {

        showStatus(
            "Informe o nome do local.",
            "error"
        );

        localInput.focus();

        return;
    }

    if (!validarCoordenadas()) {

        return;
    }

    // Confirma que os campos estão normalizados.
    // Exemplo: -22.913604
    // Não: -22.913.604

    btnSubmit.disabled = true;

    btnSubmit.textContent = "Enviando...";

    btnGPS.disabled = true;

    showStatus(
        "Enviando informações para o Google Forms...",
        "info"
    );

    aguardandoResposta = true;

    // Envio nativo pelo formulário HTML.
    // Não utiliza fetch ou no-cors.

    form.submit();

});


// ======================================
// RETORNO DO IFRAME
// ======================================

document
.getElementById("googleFormFrame")
.addEventListener("load", function() {

    if (!aguardandoResposta) return;

    aguardandoResposta = false;

    btnSubmit.disabled = false;

    btnGPS.disabled = false;

    btnSubmit.textContent = "Enviar registro";

    showStatus(
        "Envio encaminhado! Consulte a planilha de respostas para confirmar o registro.",
        "success"
    );

});

</script>

</body>
</html>
